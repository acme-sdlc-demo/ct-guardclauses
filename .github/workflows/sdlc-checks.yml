# Written by the Agentic SDLC Platform from the Project's config; change it through the platform.
# It runs exactly the platform's gate.
name: sdlc-checks
'on':
  pull_request: {}
  push:
    branches:
    - main
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: 'install: dotnet restore'
      run: dotnet restore
    - name: dotnet build --configuration Release --no-restore
      run: dotnet build --configuration Release --no-restore
    - name: dotnet test --no-build --no-restore --configuration Release --verbosity
        normal
      run: dotnet test --no-build --no-restore --configuration Release --verbosity
        normal
